<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sweetie 💕</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
      background-size: 400% 400%;
      animation: bgMove 12s ease infinite;
      padding: 24px;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .hub {
      width: min(92%, 440px);
      padding: 44px 32px 40px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      text-align: center;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.22),
        inset 0 0 0 1px rgba(255, 255, 255, 0.45);
      animation: fadeIn 0.9s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hub-emoji {
      font-size: 56px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(24px, 5vw, 30px);
      color: #4a1c2f;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 14px;
      color: #7a4a5c;
      margin-bottom: 32px;
    }

    .page-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .page-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-radius: 18px;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(255, 107, 157, 0.25);
      color: #4a1c2f;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 8px 24px rgba(255, 77, 109, 0.12);
    }

    .page-link:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 77, 109, 0.45);
      box-shadow: 0 14px 32px rgba(255, 77, 109, 0.22);
    }

    .page-link:active {
      transform: scale(0.98);
    }

    .page-icon {
      font-size: 32px;
      flex-shrink: 0;
      width: 48px;
      text-align: center;
    }

    .page-info {
      flex: 1;
      text-align: left;
    }

    .page-name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 2px;
    }

    .page-desc {
      font-size: 13px;
      color: #8a5a6a;
    }

    .page-arrow {
      font-size: 18px;
      color: #ff4d6d;
      opacity: 0.7;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #9a6a7a;
      font-style: italic;
    }
  </style>
</head>
<body>
  <main class="hub">
    <div class="hub-emoji">💕</div>
    <h1>Choose a Page</h1>
    <p class="subtitle">Pick a little surprise ✨</p>

    <nav class="page-list">
      <a class="page-link" href="sweetie-letters.html">
        <span class="page-icon">💖</span>
        <span class="page-info">
          <span class="page-name">Letters</span>
          <span class="page-desc">For sweetie, Hồng Tâm</span>
        </span>
        <span class="page-arrow">→</span>
      </a>

      <a class="page-link" id="bloomLink" href="bloom.html">
        <span class="page-icon">💌</span>
        <span class="page-info">
          <span class="page-name">Anniversary</span>
          <span class="page-desc">Sweet Invitation</span>
        </span>
        <span class="page-arrow">→</span>
      </a>

      <a class="page-link" href="pacar.html">
        <span class="page-icon">📆</span>
        <span class="page-info">
          <span class="page-name">Pacar</span>
          <span class="page-desc">Date Invitation</span>
        </span>
        <span class="page-arrow">→</span>
      </a>
    </nav>

    <p class="footer">Made with love for Hồng Tâm</p>
  </main>
  <script>
    document.getElementById("bloomLink")?.addEventListener("mousedown", () => {
      localStorage.setItem("bloomMusicUnlock", "1");
    });
    document.getElementById("bloomLink")?.addEventListener("touchstart", () => {
      localStorage.setItem("bloomMusicUnlock", "1");
    }, { passive: true });
  </script>
</body>
</html>
